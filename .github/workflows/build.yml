name: Build

concurrency: 
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"
      
      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          if ! ./gradlew make makePluginsJson --stacktrace 2>&1 | tee build.log; then
            echo "Build failed! Pushing build.log to builds branch..."
            cp build.log $GITHUB_WORKSPACE/builds/build_error.txt
            cd $GITHUB_WORKSPACE/builds
            git config --local user.email "actions@github.com"
            git config --local user.name "GitHub Actions"
            git add build_error.txt
            git commit --amend -m "Build error log" || git commit -m "Build error log"
            git push --force || true
            exit 1
          fi
          cp -f **/build/*.cs3 $GITHUB_WORKSPACE/builds/ 2>/dev/null || true
          cp -f build/plugins.json $GITHUB_WORKSPACE/builds/ 2>/dev/null || true
          cp -f repo.json $GITHUB_WORKSPACE/builds/ 2>/dev/null || true

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0
          git push --force
